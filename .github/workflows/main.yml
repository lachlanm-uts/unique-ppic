name: Collaborative Workflow

on:
  push:
    branches:
      - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps: 
    # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3
    # Step 2: Update index.html
       # Check if the GitHub actor is the team leader
       # Run the following CLI command to update index.html
      - name: Update index.html file
        run: sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html
    # Step 3: Update README
      # Append a log entry to README file
      - name: Update README
        run: echo "###Updated by ${{ github.triggering_actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md 
